name: Update Bun Lockfile

on:
  pull_request_target:

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # The lockfile commit below goes through the GitHub API (so it is
          # signed), not git push, so the checkout token is never needed —
          # and bun install runs third-party lifecycle scripts that must not
          # find a write-scoped token in .git/config.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install

      - name: Commit updated lockfile via the API so it is signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock unchanged"
            exit 0
          fi
          # Commits made through the API are signed by GitHub. Committing with
          # the git CLI would produce an unsigned commit, which the
          # required_signatures rule on main rejects at merge time.
          #
          # The payload is built with jq and sent via --input rather than as
          # --raw-field arguments: the base64 lockfile is a single argv entry,
          # and Linux caps one argument at 128 KiB (MAX_ARG_STRLEN), which
          # bun.lock now exceeds ("Argument list too long", exit 126).
          base64 -w0 bun.lock > "$RUNNER_TEMP/bun.lock.b64"
          jq -n \
            --arg message "chore: update bun.lock" \
            --arg branch "$BRANCH" \
            --arg sha "$(git rev-parse HEAD:bun.lock)" \
            --rawfile content "$RUNNER_TEMP/bun.lock.b64" \
            '{message: $message, branch: $branch, sha: $sha, content: $content}' \
            > "$RUNNER_TEMP/commit-payload.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/bun.lock" \
            --method PUT \
            --input "$RUNNER_TEMP/commit-payload.json" \
            --silent
