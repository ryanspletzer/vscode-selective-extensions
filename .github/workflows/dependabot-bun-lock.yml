name: Update Bun Lockfile

on:
  pull_request_target:

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install

      - name: Commit updated lockfile via the API so it is signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock unchanged"
            exit 0
          fi
          # Commits made through the API are signed by GitHub. Committing with
          # the git CLI would produce an unsigned commit, which the
          # required_signatures rule on main rejects at merge time.
          gh api "repos/$GITHUB_REPOSITORY/contents/bun.lock" \
            --method PUT \
            --raw-field message="chore: update bun.lock" \
            --raw-field branch="$BRANCH" \
            --raw-field sha="$(git rev-parse HEAD:bun.lock)" \
            --raw-field content="$(base64 -w0 bun.lock)" \
            --silent
